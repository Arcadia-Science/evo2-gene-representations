[project]
name = "glm-latent-mapping"
description = "exploring glm latent spaces"
version = "0.0.0"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.12.0",
    "gpn @ git+https://github.com/songlab-cal/gpn.git",
    "transformers>=4.40.0,<5.0.0",
    "datasets>=2.20.0",
    "huggingface_hub>=0.23.0",
    "scikit-learn>=1.3.0",
    "evo2",
    "zarr>=2.0.0,<3.0.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.0.0",
    "pre-commit>=3.5.0",
    "pytest>=9.0.3",
    "ruff>=0.4.8",
]


[tool.ruff]
# The directories to consider when resolving first- vs. third-party imports
src = ["."]

line-length = 100
indent-width = 4

# run ruff on jupyter notebooks (this is not enabled by default)
extend-include = ["*.ipynb"]

[tool.ruff.lint.per-file-ignores]
# ignore star and unused imports
"__init__.py" = ["F403", "F405"]

[tool.ruff.lint]
select = [
    # flake8-bugbear
    "B",
    # pycodestyle error
    "E",
    # pyflakes
    "F",
    # isort
    "I",
    # pyupgrade
    "UP",
    # pycodestyle warning
    "W",
]

# rule codes to ignore
ignore = []

# Allows fix for all enabled rules when `--fix` is provided
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Like Black, use double quotes, indent with spaces, and respect trailing commas
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
order-by-type = true
no-lines-before = ["future", "standard-library"]
