name: lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit==3.5.0 ruff==0.15.16 pytest==9.0.3 \
            numpy scipy pandas POT matplotlib arcadia-pycolor fonttools edlib

      - name: Run Ruff
        run: ruff check --output-format=github .

      - name: Run Ruff formatter
        run: ruff format --check .

      - name: Run tests
        run: pytest -q
